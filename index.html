:root{--desk:#e8e5dc;--paper:#faf8f1;--ink:#1d2825;--muted:#797d72;--line:#d8d7c9;--accent:#a54832;--forest:#203d37;--gold:#b9985c;--pad:clamp(18px,2.15vw,32px);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--desk);background-image:radial-gradient(rgba(83,78,64,.11) .55px,transparent .7px);background-size:8px 8px;color:var(--ink);font-family:MenuSans,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #bd7757;outline-offset:3px}
.site-header{min-height:69px;max-width:1440px;margin:auto;padding:13px 34px;display:flex;align-items:center;gap:30px;border-bottom:1px solid rgba(76,82,70,.17)}
.brand{display:flex;align-items:center;gap:11px;flex:none;text-decoration:none;color:var(--ink)}
.brand-mark{width:38px;height:38px;border:1px solid #6d786d;display:grid;place-items:center;font:400 17px MenuSerif,Georgia,serif;letter-spacing:-.08em}
.brand-name{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.brand-name span{display:block;font-size:9px;letter-spacing:.05em;color:#80877b;font-weight:400;text-transform:none;margin-top:2px}
.nav{display:flex;align-items:center;gap:24px;margin-left:8px}
.nav button{border:0;padding:6px 0;background:none;color:#61695f;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.nav button:hover{color:var(--accent)}
.nav [data-nav="cover"]{text-transform:none}
.search-shell{position:relative;margin-left:auto;width:222px;flex:0 1 222px}
.search-box{height:36px;border:1px solid #cbcfc2;background:rgba(255,255,255,.35);display:flex;align-items:center;gap:8px;padding:0 10px}
.search-icon{font-size:17px;line-height:1;color:#7d857b;transform:translateY(-1px)}
.search-box input{min-width:0;width:100%;border:0;outline:0;background:transparent;font-size:11px;color:var(--ink)}
.search-box input::placeholder{color:#8b9186}
.search-results{position:absolute;top:42px;right:0;width:min(340px,90vw);max-height:320px;overflow:auto;background:#fffef9;border:1px solid #d8d6c9;box-shadow:0 12px 32px rgba(37,43,35,.16);z-index:50;padding:5px}
.search-results[hidden]{display:none}
.search-result{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;color:var(--ink)}
.search-result:hover,.search-result:focus-visible{background:#f0eee5}
.search-result b{font-size:11px}.search-result small{font-size:9px;color:#8c8d80;letter-spacing:.06em;text-transform:uppercase}
.no-results{padding:12px;font-size:11px;color:#7c8075}
.reading-area{max-width:1400px;margin:auto;padding:15px 18px 18px;display:flex;align-items:center;flex-direction:column}
.edition-bar{width:min(1010px,calc(100vw - 56px),max(795px,calc((100vh - 224px)*1.5)));display:flex;align-items:center;justify-content:space-between;color:#83877b;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}
.edition-bar .edition-right{font-weight:500;letter-spacing:.1em}
.book{position:relative;width:min(1010px,calc(100vw - 56px),max(795px,calc((100vh - 224px)*1.5)));aspect-ratio:1.5;perspective:2400px;isolation:isolate;touch-action:pan-y;filter:drop-shadow(0 18px 18px rgba(59,57,45,.13))}
.book:before{content:"";position:absolute;inset:5px -7px -7px;border:1px solid #c8c5b6;background:repeating-linear-gradient(to bottom,#e9e6da 0,#e9e6da 2px,#d4d0c0 3px,#f4f0e5 4px);border-radius:2px;box-shadow:0 8px 0 -4px #ccc8b8,0 15px 28px rgba(60,55,43,.15)}
.page-surface{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(129,126,107,.17)}
.page-left{left:0;border-radius:3px 0 0 3px}.page-right{right:0;border-radius:0 3px 3px 0}
.page-left:after,.page-right:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4}
.page-left:after{background:linear-gradient(to right,transparent 88%,rgba(40,38,29,.10) 100%)}
.page-right:after{background:linear-gradient(to left,transparent 88%,rgba(40,38,29,.075) 100%)}
.book-spine{position:absolute;top:0;bottom:0;left:calc(50% - 7px);width:14px;z-index:5;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(43,38,30,.13) 44%,rgba(255,255,255,.2) 55%,transparent)}
.page-turn{position:absolute;top:0;height:100%;width:50%;transform-style:preserve-3d;transition:transform .78s cubic-bezier(.25,.64,.21,1);z-index:10;pointer-events:none}
.page-turn.forward{left:50%;transform-origin:left center}.page-turn.backward{left:0;transform-origin:right center}
.page-turn.forward.turning{transform:rotateY(-180deg)}.page-turn.backward.turning{transform:rotateY(180deg)}
.turn-face{position:absolute;inset:0;overflow:hidden;background:var(--paper);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 0 0 1px rgba(95,91,73,.17),-7px 0 16px rgba(36,35,26,.08)}
.turn-face.back{transform:rotateY(180deg)}
.book.is-turning .page-surface{pointer-events:none}
.page-inner{height:100%;width:100%;padding:var(--pad);display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--paper);background-image:radial-gradient(rgba(121,117,92,.11) .42px,transparent .56px);background-size:5px 5px}
.running{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:8px;line-height:1.2;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#82877b;border-bottom:1px solid var(--line);padding-bottom:10px;flex:none}
.running span:last-child{text-align:right;white-space:nowrap}
.page-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:9px;border-top:1px solid var(--line);font-size:8px;line-height:1.2;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#96978b;flex:none}
.page-footer span:last-child{font-family:MenuSerif,Georgia,serif;font-size:11px;font-weight:400;color:#4f5a50}
.eyebrow{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.serif{font-family:MenuSerif,Georgia,serif;font-weight:400}
.title-line{height:2px;width:45px;background:var(--accent);margin:13px 0}
.page-title{font-family:MenuSerif,Georgia,serif;font-weight:400;font-size:clamp(27px,2.55vw,40px);letter-spacing:-.025em;line-height:1.03;margin:13px 0 10px}
.page-copy{font-size:clamp(11px,.93vw,13px);line-height:1.55;color:#687168;margin:0}
/* Inside cover and cover */
/* Opening and closing endpapers match the blue of the peacock back cover. */
.type-endpaper{background:#293f92;color:#f3efdf;background-image:radial-gradient(rgba(255,255,255,.035) .6px,transparent .8px);background-size:6px 6px}
.end-top{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(239,235,217,.29);padding-bottom:11px;color:#d0d3be;font-size:8px;font-weight:700;letter-spacing:.17em;text-transform:uppercase}

function renderBase(){
 const cover=current===0;book.classList.toggle('cover-only',cover);document.body.classList.toggle('cover-view',cover);
 if(cover||media.matches){left.innerHTML='';right.innerHTML=pageMarkup(current)}
 else{left.innerHTML=pageMarkup(current);right.innerHTML=pageMarkup(current+1)}
 updateControls();scheduleArtBleed();warmAdjacentArtwork();
}
function goTo(raw){
 const target=normalize(raw);if(target===current&&!busy)return;
 if(busy){queued=target;return}
 if(motionMedia.matches){current=target;renderBase();return}
 const single=media.matches,direction=target>current?'forward':'backward';busy=true;book.classList.add('is-turning');updateControls();
 const sheet=document.createElement('div');sheet.className=`page-turn ${direction}`;sheet.setAttribute('aria-hidden','true');
 const face=document.createElement('div'),back=document.createElement('div');face.className='turn-face front';back.className='turn-face back';
 if(single){face.innerHTML=pageMarkup(current);back.innerHTML=pageMarkup(target);right.innerHTML=pageMarkup(target)}
 else if(direction==='forward'){face.innerHTML=pageMarkup(current===0?0:current+1);back.innerHTML=pageMarkup(target);right.innerHTML=pageMarkup(target+1)}
 else{face.innerHTML=pageMarkup(current);back.innerHTML=pageMarkup(target===0?0:target+1);left.innerHTML=pageMarkup(target===0?1:target)}
 sheet.append(face,back);book.appendChild(sheet);scheduleArtBleed();
 let done=false;
 const finish=()=>{if(done)return;done=true;sheet.remove();current=normalize(target);busy=false;book.classList.remove('is-turning');renderBase();if(queued!==null){const q=queued;queued=null;if(q!==current)goTo(q)}};
 sheet.addEventListener('transitionend',e=>{if(e.target===sheet&&e.propertyName==='transform')finish()});
 requestAnimationFrame(()=>requestAnimationFrame(()=>sheet.classList.add('turning')));
 setTimeout(finish,920);
}
function turn(delta){if(media.matches)goTo(current+delta);else if(current===0&&delta>0)goTo(1);else if(current===1&&delta<0)goTo(0);else goTo(current+delta*2)}
previous.addEventListener('click',()=>turn(-1));next.addEventListener('click',()=>turn(1));
const navTargets={cover:0,contents:3,curated:DATA.positions.curated,archive:DATA.positions.archive,back:pages.length-1};
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>goTo(navTargets[b.dataset.nav])));
let pointerStart=null,suppressArtClickUntil=0;
book.addEventListener('click',e=>{
 const jumpBtn=e.target.closest('[data-jump]');if(jumpBtn){goTo(jumpBtn.dataset.jump);return}
 const zoom=e.target.closest('[data-zoom]');if(zoom){if(performance.now()<suppressArtClickUntil){e.preventDefault();return}openArtwork(zoom.dataset.zoom,zoom.dataset.name);return}
});
let resizeInspector=null;
function openArtwork(key,name){
 const art=key==='back'?DATA.backCover:artworks.find(a=>a.image===key),description=art?.description;
 detailTitle.textContent=name;
 modalContent.innerHTML=`<div class="art-large"><div class="zoom-tools" aria-label="चित्र ज़ूम नियंत्रण"><div class="zoom-controls"><button type="button" class="zoom-out" aria-label="चित्र छोटा करें" disabled>−</button><output class="zoom-level" aria-live="polite">100%</output><button type="button" class="zoom-in" aria-label="चित्र बड़ा करें">+</button></div><button type="button" class="zoom-fit" disabled>पूरा चित्र</button><span class="zoom-help" id="zoom-help">बड़ा करके खिसकाएँ · AVIF</span></div><div class="zoom-frame" tabindex="0" role="region" aria-label="ज़ूम किया हुआ चित्र" aria-describedby="zoom-help"><div class="zoom-mat"><img src="${assetSource(key)}" alt="${esc(name)}" draggable="false" style="visibility:hidden"></div></div>${description?`<p class="art-description">${esc(description)}</p>`:''}<p>चित्र · The Designer’s Menu</p></div>`;
 dialog.showModal();
 const frame=modalContent.querySelector('.zoom-frame'),mat=modalContent.querySelector('.zoom-mat'),image=mat.querySelector('img');
 const minus=modalContent.querySelector('.zoom-out'),plus=modalContent.querySelector('.zoom-in'),fit=modalContent.querySelector('.zoom-fit'),readout=modalContent.querySelector('.zoom-level');
 const levels=[1,1.5,2,3,4];let index=0,drawW=0,drawH=0;
 function drawInspector(preserve=true){
  if(!dialog.open||!frame.isConnected||!image.naturalWidth||!image.naturalHeight)return;
  let cx=.5,cy=.5;
  if(preserve&&drawW&&drawH){
   const mw=parseFloat(mat.style.width)||frame.clientWidth,mh=parseFloat(mat.style.height)||frame.clientHeight;
   cx=(frame.scrollLeft+frame.clientWidth/2-(mw-drawW)/2)/drawW;
   cy=(frame.scrollTop+frame.clientHeight/2-(mh-drawH)/2)/drawH;
   cx=Math.max(0,Math.min(1,cx));cy=Math.max(0,Math.min(1,cy));
  }
  const maxH=Math.max(160,Math.min(680,window.innerHeight-245));
  frame.style.height=`${Math.round(Math.max(160,Math.min(maxH,frame.clientWidth*image.naturalHeight/image.naturalWidth)))}px`;
  const fw=frame.clientWidth,fh=frame.clientHeight;
  const base=Math.min(fw/image.naturalWidth,fh/image.naturalHeight),scale=base*levels[index];
  drawW=image.naturalWidth*scale;drawH=image.naturalHeight*scale;
  const mw=Math.max(fw,drawW),mh=Math.max(fh,drawH);
  mat.style.width=`${mw}px`;mat.style.height=`${mh}px`;
  // AVIF is a raster image: high zoom is limited by its source resolution.
  image.style.width=`${drawW}px`;image.style.height=`${drawH}px`;image.style.visibility='visible';
  frame.scrollLeft=Math.max(0,(mw-drawW)/2+cx*drawW-fw/2);
  frame.scrollTop=Math.max(0,(mh-drawH)/2+cy*drawH-fh/2);
  readout.textContent=`${Math.round(levels[index]*100)}%`;
  minus.disabled=index===0;plus.disabled=index===levels.length-1;fit.disabled=index===0;
 }
 function changeZoom(delta){const next=Math.max(0,Math.min(levels.length-1,index+delta));if(next!==index){index=next;drawInspector(true)}}
 minus.addEventListener('click',()=>changeZoom(-1));plus.addEventListener('click',()=>changeZoom(1));
 fit.addEventListener('click',()=>{index=0;drawInspector(false)});
 frame.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='='){e.preventDefault();changeZoom(1)}else if(e.key==='-'||e.key==='_'){e.preventDefault();changeZoom(-1)}else if(e.key==='0'){e.preventDefault();index=0;drawInspector(false)}});
 frame.addEventListener('dblclick',()=>{index=index===0?2:0;drawInspector(false)});
 // Touch devices use native pan/scroll; mouse users can drag the enlarged art.
 let drag=null;
 frame.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0||index===0)return;drag={x:e.clientX,y:e.clientY,left:frame.scrollLeft,top:frame.scrollTop};frame.setPointerCapture(e.pointerId);frame.classList.add('is-dragging');e.preventDefault()});
 frame.addEventListener('pointermove',e=>{if(!drag)return;frame.scrollLeft=drag.left-(e.clientX-drag.x);frame.scrollTop=drag.top-(e.clientY-drag.y)});
 const endDrag=()=>{drag=null;frame.classList.remove('is-dragging')};
 frame.addEventListener('pointerup',endDrag);frame.addEventListener('pointercancel',endDrag);frame.addEventListener('lostpointercapture',endDrag);
 resizeInspector=()=>drawInspector(true);
 const ready=()=>{if(dialog.open&&frame.isConnected)drawInspector(false)};
 if(image.complete&&image.naturalWidth)ready();else image.addEventListener('load',ready,{once:true});
}
window.addEventListener('resize',()=>{if(dialog.open&&resizeInspector)resizeInspector()});
$('modal-close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>{resizeInspector=null;modalContent.innerHTML=''});dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
// A tap on an artwork enlarges it; a horizontal swipe on the artwork itself
// still turns the page. Other buttons and website links retain native behavior.
book.addEventListener('pointerdown',e=>{suppressArtClickUntil=0;const interactive=e.target.closest('button,a');if(interactive&&!interactive.matches('.art-image'))return;pointerStart={x:e.clientX,y:e.clientY,art:interactive}});
book.addEventListener('pointerup',e=>{
 if(!pointerStart)return;
 const dx=e.clientX-pointerStart.x,dy=e.clientY-pointerStart.y,art=pointerStart.art;pointerStart=null;
 if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25){if(art)suppressArtClickUntil=performance.now()+400;const direction=dx<0?1:-1;requestAnimationFrame(()=>turn(direction))}
 else if(art&&e.pointerType==='touch'&&Math.abs(dx)<10&&Math.abs(dy)<10&&!busy){
  // Open on touch release so an immediate tap after a swipe is responsive,
  // even if the browser suppresses the corresponding synthetic click.
  suppressArtClickUntil=performance.now()+400;
  if(!dialog.open)openArtwork(art.dataset.zoom,art.dataset.name);
 }
});
book.addEventListener('pointercancel',()=>{pointerStart=null});
book.addEventListener('dragstart',e=>{if(e.target.closest('.art-image'))e.preventDefault()});
document.addEventListener('keydown',e=>{if(dialog.open||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();turn(1)}else if(e.key==='ArrowLeft'){e.preventDefault();turn(-1)}});
media.addEventListener('change',()=>{if(busy)return;current=normalize(current);renderBase()});
const search=$('search'),results=$('search-results');
const searchIndex=[...curated.flatMap(c=>[{name:c.title,kind:'श्रेणी · '+c.hindi,page:c.page,keywords:c.hindi+' '+c.intro},...c.items.map(x=>({name:x.name,kind:'काम की श्रेणियाँ · '+c.title,page:x.page,keywords:c.hindi+' '+x.description+' '+x.note+' '+x.price+' '+x.url}))]),...chapters.flatMap(c=>c.items.map(x=>({name:x.name,kind:'पुरानी Website · '+c.title,page:x.page,keywords:x.description+' '+x.originalDescription}))),...catalog.flatMap(c=>c.items.map(x=>({name:x.name,kind:'नई Website · '+c.title,page:x.page,keywords:x.description+' '+x.note+' '+x.price+' '+x.url}))),...artworks.map(a=>({name:a.title,kind:'चित्र · '+a.group,page:a.page,number:a.number,keywords:a.searchName+' '+(a.description||'')+' '+String(a.number).padStart(2,'0')+' '+a.number})),{name:DATA.backCover.title,kind:'बैक कवर',page:pages.length-1,keywords:DATA.backCover.searchName+' '+DATA.backCover.description}];
function closeSearch(){results.hidden=true;search.setAttribute('aria-expanded','false')}
function updateSearch(){const q=search.value.trim().toLocaleLowerCase();results.replaceChildren();if(!q){closeSearch();return}const found=searchIndex.filter(x=>(x.name+' '+x.kind+' '+x.keywords).toLocaleLowerCase().includes(q));const rank=x=>{if(/^\d{1,2}$/.test(q)&&x.number===Number(q))return -1;const name=x.name.toLocaleLowerCase();return name===q?0:name.startsWith(q)?1:2};found.sort((a,b)=>rank(a)-rank(b));const matches=found.slice(0,30);if(!matches.length){const msg=document.createElement('div');msg.className='no-results';msg.textContent='कोई नतीजा नहीं मिला।';results.append(msg)}else matches.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='search-result';const a=document.createElement('b'),small=document.createElement('small');a.textContent=item.name;small.textContent=item.kind;b.append(a,small);b.addEventListener('click',()=>{goTo(item.page);search.value='';closeSearch()});results.append(b)});results.hidden=false;search.setAttribute('aria-expanded','true')}
search.addEventListener('input',updateSearch);search.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();if(e.key==='Enter'){const result=results.querySelector('button');if(result){e.preventDefault();result.click()}}});document.addEventListener('click',e=>{if(!e.target.closest('.search-shell'))closeSearch()});
renderBase();
window.__magazine={goTo,get current(){return current},get pageCount(){return pages.length},get imageCount(){return Object.keys(images).length},get resourceCount(){return resourceCount},get legacyCount(){return legacyCount},get catalogCount(){return catalogCount},get curatedCount(){return curatedCount},pages};
